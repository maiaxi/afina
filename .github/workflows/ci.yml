name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Testes do AfinaCore
        run: swift test --package-path Packages/AfinaCore

      - name: Build da app
        run: xcodebuild -project Afina.xcodeproj -scheme Afina -configuration Debug -derivedDataPath build build
