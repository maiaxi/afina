# Especificação do projeto Xcode. Gerar com: xcodegen generate
name: Afina
options:
  bundleIdPrefix: com.joaomaia
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: pt-PT
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  AfinaCore:
    path: Packages/AfinaCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Afina:
    type: application
    platform: macOS
    sources:
      - path: Afina
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: AfinaCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaomaia.Afina
        PRODUCT_NAME: Afina
        INFOPLIST_FILE: Afina/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Afina/Afina.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Afina:
    build:
      targets:
        Afina: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AfinaCore/AfinaCoreTests
    archive:
      config: Release
